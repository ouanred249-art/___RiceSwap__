# RiceSwap — snippet for your Hyprland keybinds.
#
# This file ships as a data file (installed to /usr/share/riceswap by the
# package and the release tarball). Nothing in the package or in RiceSwap's
# onboarding edits your Hyprland config: add these lines yourself (or via
# your own dotfiles tool) under your keybinds.
#
# The two binds and their sources:
#   * `exec-once = qs -c riceswap` — the autostart for the panel. Quickshell
#     picks up the config from its user dir (where `init` copies the
#     packaged GUI config on first run), so the panel is up after the
#     autostart — even on the packaged install.
#   * `bind = $mainMod, R, global, quickshell:riceswap-toggle` — Super+R
#     toggles the panel through Quickshell's global-shortcuts protocol. The
#     `$mainMod` substitution comes from Hyprland's variables section.
#     The panel also answers the `IpcHandler` fallback: `qs ipc call
#     riceswap toggle` works without any keybind at all.

exec-once = qs -c riceswap
bind = $mainMod, R, global, quickshell:riceswap-toggle
