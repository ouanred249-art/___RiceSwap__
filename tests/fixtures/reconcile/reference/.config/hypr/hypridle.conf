# This Hyprland evaluates `dispatch` arguments as Lua, so the hl.dsp.global
# string form is correct — only the dispatcher NAME matters, and caelestia
# registers its shortcuts under the `caelestia` appid, not `quickshell`.
$lock_cmd = hyprctl dispatch 'hl.dsp.global("caelestia:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # Upstream's "restore lock" recipe: wake the detached shell, then lock it.
    after_sleep_cmd = caelestia shell -d >/dev/null 2>&1; hyprctl dispatch 'hl.dsp.global("caelestia:lock")'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
