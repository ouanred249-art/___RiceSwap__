[package]
name = "riceswap"
version = "0.1.0"
edition = "2024"
description = "RiceSwap backend: one subprocess per operation, NDJSON on stdout."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Only for `kill(2)`: the research tier terminates a hung `pi` with SIGTERM
# before its SIGKILL backstop, and std has no way to send a chosen signal.
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
assert_cmd = "2"
serde_json = "1"
tempfile = "3"
